[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
solc_version = "0.8.26"

optimizer = true
optimizer_runs = 200

# Exclude test files from lib compilation to avoid conflicts
exclude_paths = ["lib/*/test/**", "lib/*/test/**/*"]
# fix forge bug which auto remaps to lib/v4-core/src
remappings = [
    "v4-core/=lib/v4-periphery/lib/v4-core/",
    "aegis-dfm/=lib/AEGIS_DFM/src/",
    "v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/v4-core/lib/solmate/",
    "permit2/=lib/v4-periphery/lib/permit2/",
]

fs_permissions = [
    { access = "read", path = "./script/config" },
    { access = "read-write", path = "./script/deploys/" }
]
# default sender will break nonce compute
sender = '0xe03b4133fff5d4023ec125c11167e1ba8d7419de'
tx_origin = '0xe03b4133fff5d4023ec125c11167e1ba8d7419de'

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[etherscan]
sepolia = { key = "" }
